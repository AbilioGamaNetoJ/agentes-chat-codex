# Fork image: builds the same image as the upstream Dockerfile and publishes it to
# ghcr.io/abiliogamanetoj/agentes-chat-codex. Runs on pushes to the fork's own branches
# and on manual dispatch. Kept separate from the upstream ci.yml so rebasing on the
# upstream never touches it.
name: Fork image

on:
  push:
    branches:
      - main
      - "agentes/dev/base"
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/abiliogamanetoj/agentes-chat-codex:latest
            ghcr.io/abiliogamanetoj/agentes-chat-codex:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
